# RetroPi baseline RetroArch config.
# Merged into ~/.config/retroarch/retroarch.cfg on install; anything the user
# changes in the RetroArch menu afterwards wins.

# --- video -------------------------------------------------------------------
video_driver = "glcore"
video_fullscreen = "true"
video_vsync = "true"
video_smooth = "false"
video_scale_integer = "true"
video_aspect_ratio_auto = "true"
video_shader_enable = "false"
video_font_enable = "false"
video_msg_pos_x = "0.02"
video_msg_pos_y = "0.98"
video_black_frame_insertion = "0"

# --- audio -------------------------------------------------------------------
audio_driver = "alsa"
audio_enable = "true"
audio_sync = "true"
audio_latency = "64"

# --- menu --------------------------------------------------------------------
menu_driver = "ozone"
menu_show_load_core = "false"
menu_show_online_updater = "true"
quit_press_twice = "false"
pause_nonactive = "false"
menu_show_sublabels = "true"
menu_animation_is_active = "true"
ozone_sort_after_truncate = "true"
menu_show_core_updater = "true"
menu_timedate_enable = "true"
menu_battery_level_enable = "false"

# --- notifications: keep the screen clean like a real console ----------------
video_font_enable = "false"
notification_show_autoconfig = "false"
notification_show_config_override_load = "false"
notification_show_set_initial_disk = "false"
notification_show_screenshot = "true"

# --- saves and state ---------------------------------------------------------
savestate_auto_save = "true"
savestate_auto_load = "true"
savestate_thumbnail_enable = "true"
autosave_interval = "60"
sort_savefiles_enable = "true"
sort_savestates_enable = "true"
sort_savefiles_by_content_enable = "true"
sort_savestates_by_content_enable = "true"

# --- input: one hotkey button unlocks everything else -------------------------
# Select is the hotkey; nothing below fires unless Select is held.
input_enable_hotkey_btn = "8"
input_exit_emulator_btn = "9"
input_menu_toggle_btn = "2"
input_save_state_btn = "5"
input_load_state_btn = "4"
input_state_slot_increase_btn = "13"
input_state_slot_decrease_btn = "11"
input_toggle_fast_forward_btn = "7"
input_rewind_btn = "6"
input_screenshot_btn = "3"

# Keyboard equivalents, for when a pad is not paired yet.
input_enable_hotkey = "nul"
input_exit_emulator = "escape"
input_menu_toggle = "f1"

# --- niceties ----------------------------------------------------------------
rewind_enable = "true"
rewind_buffer_size = "20971520"
fastforward_ratio = "0.000000"
input_autodetect_enable = "true"
input_max_users = "4"
log_verbosity = "false"
